<!doctype html><html lang="ru"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Карта оповещений БПЛА</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<style>body{margin:0;font-family:sans-serif}#map{height:calc(100vh - 70px)}
#bar{height:70px;box-sizing:border-box;padding:6px 10px;font-size:13px;background:#222;color:#eee;overflow:auto}</style></head>
<body><div id="bar">Загрузка…</div><div id="map"></div>
<script>
const map=L.map('map').setView([50.6,36.6],9);
L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png',{attribution:'© OpenStreetMap'}).addTo(map);
const layer=L.layerGroup().addTo(map);let first=true;
const lg=L.control({position:'bottomleft'});
lg.onAdd=()=>{const d=L.DomUtil.create('div');
  d.style.cssText='background:#fff;padding:8px 10px;border-radius:6px;font-size:12px;line-height:1.7;box-shadow:0 1px 4px #0006;max-width:250px';
  d.innerHTML='<b>Обозначения</b><br>'+
  '<span style="color:#e00000">■</span> Красная заливка: свежее оповещение (до 15 мин)<br>'+
  '<span style="color:#ff8800">■</span> Оранжевая заливка: старше 15 мин, ждём отбоя<br>'+
  '<span style="color:#999">◌</span> Бледный пунктирный круг: возможная зона риска (+1 км)<br>'+
  '▭ Контур: территория села или посёлка<br>'+
  '○ Круг 1,5 км: объект или улица<br>○ Круг 2 км: район города<br>'+
  '<span style="color:#8b0000">■</span> Тёмно-красная заливка: ракетная опасность (весь Белгород и Белгородский район)';
  return d};lg.addTo(map);
async function refresh(){
  try{
    const d=await (await fetch('/api/markers')).json();
    layer.clearLayers();
    if(d.rocket){const st={color:'#8b0000',weight:2,fillColor:'#b00000',fillOpacity:.4};
      const pop=`<b>Ракетная опасность</b><br>${d.rocket.time}<br>${d.rocket.text}`;
      (d.rocket.zones?d.rocket.zones.map(g=>L.geoJSON(g,{style:st})):[L.circle([50.5997,36.5983],{...st,radius:25000})])
        .forEach(l=>l.bindPopup(pop).addTo(layer));}
    d.markers.forEach(m=>{
      const fresh=m.age<15,col=fresh?'#e00000':'#ff8800',fo=fresh?.45:.3;
      L.circle([m.lat,m.lon],{radius:m.r_out,color:col,weight:1,dashArray:'5',fillOpacity:.07}).addTo(layer);
      const inner=m.poly?L.geoJSON(m.poly,{style:{color:col,weight:2,fillOpacity:fo}})
                        :L.circle([m.lat,m.lon],{radius:m.r_in,color:col,weight:2,fillOpacity:fo});
      inner.bindPopup(`<b>${m.place}</b><br>${m.time} (${m.age} мин назад)<br>${m.text}`).addTo(layer);
    });
    if(first&&(d.markers.length||d.rocket)){map.fitBounds(L.featureGroup(layer.getLayers()).getBounds().pad(.3));first=false}
    document.getElementById('bar').innerHTML=(d.rocket?`<b style="color:#ff6060">РАКЕТНАЯ ОПАСНОСТЬ с ${d.rocket.time} (МСК).</b> `:'')+`Активных меток: ${d.markers.length}. Обновлено ${d.updated}. `+
      (d.unknown.length?`Место не определено: ${d.unknown.map(u=>u.place).join('; ')}. `:'')+
      '<br>Данные приблизительные, не официальный источник. Следуйте официальным оповещениям.';
  }catch(e){document.getElementById('bar').textContent='Ошибка загрузки'}
}
refresh();setInterval(refresh,15000);
</script></body></html>
